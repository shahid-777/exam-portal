<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/logo.png">
<title>Instant Quiz — Exam Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  @keyframes iq-shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  .iq-shake { animation: iq-shake 0.5s; }
  @keyframes iq-pop { 0%{transform:scale(0.9);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }
  .iq-pop { animation: iq-pop 0.25s ease-out; }
  .iq-float { animation: iq-float-up 1.1s ease-out forwards; }
  @keyframes iq-float-up { 0%{transform:translateY(0) scale(0.6); opacity:1} 100%{transform:translateY(-70px) scale(1.2); opacity:0} }
</style>
</head>
<body class="bg-slate-900 font-sans min-h-screen text-slate-200">

<header class="w-full bg-slate-950/60 border-b border-white/5 py-3 px-5 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <img src="/logo.png" class="h-7 bg-white/95 p-1 rounded-lg" onerror="this.style.display='none'">
    <span id="iq-header-subject" class="text-xs font-black uppercase tracking-widest text-cyan-400">Loading...</span>
  </div>
  <div class="flex items-center gap-4">
    <span id="iq-progress-label" class="text-[11px] font-mono text-slate-400">-- / --</span>
    <span id="iq-timer" class="text-xs font-mono font-black text-amber-400">00:00</span>
  </div>
</header>

<div class="w-full h-1 bg-slate-800">
  <div id="iq-progress-bar" class="h-1 bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300" style="width:0%"></div>
</div>

<main class="max-w-2xl w-full mx-auto px-4 py-8">

  <!-- QUESTION VIEW -->
  <div id="iq-question-view" class="hidden space-y-5">
    <div id="iq-card" class="bg-slate-950/50 border border-white/10 rounded-2xl p-6 shadow-xl iq-pop relative overflow-visible">
      <div id="iq-question-image-wrap" class="mb-4 hidden">
        <img id="iq-question-image" class="rounded-xl max-h-64 mx-auto" />
      </div>
      <div id="iq-question-table" class="mb-4"></div>
      <p id="iq-question-text" class="text-base sm:text-lg font-bold text-white leading-relaxed"></p>
      <div id="iq-options-wrap" class="mt-5 space-y-3"></div>
      <div id="iq-feedback-banner" class="hidden mt-4 text-center text-sm font-black rounded-xl py-2.5"></div>
    </div>
  </div>

  <!-- RESULT VIEW -->
  <div id="iq-result-view" class="hidden">
    <div class="bg-slate-950/50 border border-white/10 rounded-2xl p-8 shadow-xl text-center space-y-6 iq-pop">
      <div class="text-5xl">🎯</div>
      <h1 class="text-xl font-black text-white uppercase tracking-wide">Quiz Complete!</h1>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <div class="bg-slate-900/60 border border-white/5 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Score</p>
          <p id="res-score" class="text-2xl font-black text-cyan-400">0</p>
        </div>
        <div class="bg-slate-900/60 border border-white/5 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Correct</p>
          <p id="res-correct" class="text-2xl font-black text-emerald-400">0</p>
        </div>
        <div class="bg-slate-900/60 border border-white/5 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Wrong</p>
          <p id="res-wrong" class="text-2xl font-black text-red-400">0</p>
        </div>
        <div class="bg-slate-900/60 border border-white/5 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Skipped</p>
          <p id="res-skipped" class="text-2xl font-black text-slate-400">0</p>
        </div>
        <div class="bg-slate-900/60 border border-white/5 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Time Taken</p>
          <p id="res-time" class="text-2xl font-black text-amber-400">0s</p>
        </div>
        <div class="bg-slate-900/60 border border-amber-500/20 rounded-xl p-4">
          <p class="text-[10px] font-mono text-slate-500 uppercase">Your Rank</p>
          <p id="res-rank" class="text-2xl font-black text-amber-400">--</p>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button onclick="window.location.href='/dashboard.html'" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">Back to Dashboard</button>
        <button onclick="location.reload()" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">Retry Quiz</button>
      </div>
    </div>
  </div>

  <div id="iq-loading-view" class="text-center py-20">
    <p class="text-sm font-mono text-slate-500 animate-pulse">Loading quiz...</p>
  </div>

</main>

<script>
const SUPABASE_URL = "https://lelvinusfxniqrmfufql.supabase.co";
const SUPABASE_KEY = "sb_publishable_jQSp32AKdo2vkHFvNHbLWg_pEq8TBRG";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const subjectParam = params.get('subject');
const lang = (localStorage.getItem('preferredLang') || 'en');

let examRow = null;
let quizQuestions = [];
let currentIndex = 0;
let correctCount = 0, wrongCount = 0, skippedCount = 0;
let negativeMarking = 0;
let startTime = null;
let timerInterval = null;
let answersLog = [];
let locked = false;

window.onload = async function () {
  const userEmail = localStorage.getItem('userEmail');
  if (!userEmail) { window.location.replace('/index.html'); return; }
  if (!subjectParam) { alert("No subject specified."); window.location.href = '/dashboard.html'; return; }
  await loadExamAndStart();
};

async function loadExamAndStart() {
  try {
    const { data, error } = await supabaseClient
      .from('exams')
      .select('*')
      .eq('subject', decodeURIComponent(subjectParam))
      .maybeSingle();
    if (error || !data) throw new Error("Exam not found.");
    examRow = data;
    negativeMarking = parseFloat(examRow.negative_marking || 0);

    let pool = Array.isArray(examRow.questions_json) ? [...examRow.questions_json] : JSON.parse(examRow.questions_json || "[]");
    if (examRow.shuffle_questions !== false) pool = shuffleArray(pool);
    if (examRow.questions_per_attempt) pool = pool.slice(0, examRow.questions_per_attempt);

    quizQuestions = pool.map(q => prepareQuestion(q, examRow.shuffle_options !== false));

    document.getElementById('iq-header-subject').textContent = examRow.subject;
    document.getElementById('iq-loading-view').classList.add('hidden');
    document.getElementById('iq-question-view').classList.remove('hidden');

    startTime = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 1000);
    renderQuestion();
  } catch (e) {
    document.getElementById('iq-loading-view').innerHTML = `<p class="text-red-400 font-mono text-sm">Failed to load: ${e.message}</p>`;
  }
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestion(q, doShuffleOptions) {
  const options = (q.options || []).map((o, idx) => ({ ...o, _origIndex: idx }));
  const shuffled = doShuffleOptions ? shuffleArray(options) : options;
  const newCorrectIndex = shuffled.findIndex(o => o._origIndex === q.correct);
  return {
    id: q.id,
    question: q.question,
    question_image: q.question_image,
    table: q.table,
    options: shuffled,
    correct: newCorrectIndex,
    explanation: q.explanation
  };
}

function updateTimerDisplay() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('iq-timer').textContent = `${m}:${s}`;
}

function renderQuestion() {
  locked = false;
  const q = quizQuestions[currentIndex];
  document.getElementById('iq-progress-label').textContent = `${currentIndex + 1} / ${quizQuestions.length}`;
  document.getElementById('iq-progress-bar').style.width = `${((currentIndex) / quizQuestions.length) * 100}%`;

  const imgWrap = document.getElementById('iq-question-image-wrap');
  if (q.question_image) {
    document.getElementById('iq-question-image').src = q.question_image;
    imgWrap.classList.remove('hidden');
  } else {
    imgWrap.classList.add('hidden');
  }

  document.getElementById('iq-question-table').innerHTML = q.table ? window.renderMcqTableHtmlSafe(q.table) : '';
  document.getElementById('iq-question-text').textContent = (lang === 'hi' ? q.question.hi : q.question.en) || q.question.en;

  const feedback = document.getElementById('iq-feedback-banner');
  feedback.classList.add('hidden');
  feedback.textContent = '';

  const wrap = document.getElementById('iq-options-wrap');
  wrap.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = "iq-option w-full text-left px-4 py-3 rounded-xl border border-white/10 bg-slate-900/60 hover:bg-slate-800 text-sm font-medium text-slate-200 transition flex items-center gap-3 cursor-pointer";
    btn.innerHTML = `<span class="h-6 w-6 shrink-0 rounded-full border border-white/20 flex items-center justify-center text-[10px] font-black font-mono">${String.fromCharCode(65 + idx)}</span><span class="flex-1">${escapeHtml(lang === 'hi' ? opt.hi : opt.en)}</span>`;
    btn.onclick = () => selectOption(idx, btn);
    wrap.appendChild(btn);
  });

  document.getElementById('iq-card').classList.remove('iq-pop');
  void document.getElementById('iq-card').offsetWidth;
  document.getElementById('iq-card').classList.add('iq-pop');

  answersLog.push({ question_id: q.id, selected_index: null, correct_index: q.correct, is_correct: null, question_start: Date.now() });
}

window.renderMcqTableHtmlSafe = function (table) {
  if (!table || !table.headers) return '';
  let html = `<div class="overflow-x-auto mb-3 rounded-xl border border-white/10"><table class="min-w-full text-xs">`;
  html += `<tr>` + table.headers.map(h => `<th class="px-3 py-2 bg-slate-800/60 font-black border border-white/5">${escapeHtml(h)}</th>`).join('') + `</tr>`;
  (table.rows || []).forEach(row => {
    html += `<tr>` + row.map(c => `<td class="px-3 py-2 border border-white/5">${escapeHtml(c)}</td>`).join('') + `</tr>`;
  });
  html += `</table></div>`;
  return html;
};

function escapeHtml(t) { return String(t || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function selectOption(idx, btnEl) {
  if (locked) return;
  locked = true;
  const q = quizQuestions[currentIndex];
  const isCorrect = idx === q.correct;
  const allButtons = document.querySelectorAll('#iq-options-wrap .iq-option');
  const feedback = document.getElementById('iq-feedback-banner');

  const log = answersLog[answersLog.length - 1];
  log.selected_index = idx;
  log.is_correct = isCorrect;
  log.time_ms = Date.now() - log.question_start;

  if (isCorrect) {
    correctCount++;
    btnEl.classList.add('!bg-emerald-500/20', '!border-emerald-500/60', '!text-emerald-300');
    fireFlowers(btnEl);
    feedback.className = 'mt-4 text-center text-sm font-black rounded-xl py-2.5 bg-emerald-500/10 text-emerald-300 border border-emerald-500/30';
    feedback.textContent = lang === 'hi' ? '✅ सही जवाब! शानदार 🌸' : '✅ Correct! Well done 🌸';
  } else {
    wrongCount++;
    btnEl.classList.add('!bg-red-500/20', '!border-red-500/60', '!text-red-300', 'iq-shake');
    allButtons[q.correct].classList.add('!bg-emerald-500/20', '!border-emerald-500/60', '!text-emerald-300');
    feedback.className = 'mt-4 text-center text-sm font-black rounded-xl py-2.5 bg-red-500/10 text-red-300 border border-red-500/30';
    feedback.textContent = lang === 'hi' ? '❌ गलत जवाब' : '❌ Wrong Answer';
  }
  feedback.classList.remove('hidden');
  allButtons.forEach(b => b.disabled = true);

  setTimeout(nextQuestion, isCorrect ? 900 : 1400);
}

function fireFlowers(btnEl) {
  // small local emoji burst near the clicked option
  const rect = btnEl.getBoundingClientRect();
  const emojis = ['🌸','🌼','✨','🎉'];
  for (let i = 0; i < 6; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.position = 'fixed';
    span.style.left = (rect.left + rect.width * Math.random()) + 'px';
    span.style.top = rect.top + 'px';
    span.style.fontSize = (14 + Math.random() * 10) + 'px';
    span.style.zIndex = 9999;
    span.className = 'iq-float pointer-events-none';
    document.body.appendChild(span);
    setTimeout(() => span.remove(), 1200);
  }
  if (window.confetti) {
    confetti({
      particleCount: 40,
      spread: 60,
      startVelocity: 25,
      origin: { x: (rect.left + rect.width / 2) / window.innerWidth, y: rect.top / window.innerHeight },
      colors: ['#22d3ee', '#34d399', '#f472b6', '#fbbf24']
    });
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

async function finishQuiz() {
  clearInterval(timerInterval);
  document.getElementById('iq-progress-bar').style.width = '100%';
  const timeTakenSeconds = Math.floor((Date.now() - startTime) / 1000);
  skippedCount = quizQuestions.length - correctCount - wrongCount;
  const score = (correctCount * 1) - (wrongCount * negativeMarking);

  document.getElementById('iq-question-view').classList.add('hidden');
  document.getElementById('iq-result-view').classList.remove('hidden');
  document.getElementById('res-score').textContent = score.toFixed(2);
  document.getElementById('res-correct').textContent = correctCount;
  document.getElementById('res-wrong').textContent = wrongCount;
  document.getElementById('res-skipped').textContent = skippedCount;
  const m = Math.floor(timeTakenSeconds / 60), s = timeTakenSeconds % 60;
  document.getElementById('res-time').textContent = `${m}m ${s}s`;

  const userEmail = localStorage.getItem('userEmail');
  try {
    // Writes into your existing `results` table — same table your
    // standard/live exams already use, just with exam_id + time_taken_seconds
    // filled in (added by the migration) so it can be ranked.
    const { error } = await supabaseClient
      .from('results')
      .insert([{
        exam_id: examRow.id,
        subject: examRow.subject,
        email: userEmail,
        name: localStorage.getItem('userName') || null,
        total_questions: quizQuestions.length,
        correct_answers: correctCount,
        wrong_answers: wrongCount,
        unattempted: skippedCount,
        score: score,
        time_taken_seconds: timeTakenSeconds,
        mode: 'instant',
        submitted_at: new Date().toISOString(),
        user_responses_json: JSON.stringify(answersLog),
        questions_snapshot_json: JSON.stringify(quizQuestions)
      }]);
    if (error) throw error;

    const { data: lb } = await supabaseClient
      .from('quiz_leaderboard')
      .select('rank, email')
      .eq('exam_id', examRow.id)
      .order('rank', { ascending: true });
    const mine = (lb || []).find(r => r.email === userEmail);
    document.getElementById('res-rank').textContent = mine ? `#${mine.rank} / ${lb.length}` : '--';
  } catch (e) {
    console.error("Failed to save attempt:", e);
    document.getElementById('res-rank').textContent = 'N/A';
  }
}
</script>
</body>
</html>
