<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>अक्षर उड़ान | KidsTutor — Exam Portal CSE</title>
<meta name="description" content="KidsTutor — Exam Portal CSE का किड्स लर्निंग पैनल, अक्षर उड़ान द्वारा। बच्चों के लिए हिंदी मात्राएँ, व्याकरण, English Grammar, गणित और अबेकस के मज़ेदार खेल।">
<link rel="icon" type="image/png" href="/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Da+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap');

:root{
  --sky-top:#BFE6FF;
  --sky-bottom:#F3FBFF;
  --marigold:#FFA630;
  --marigold-dark:#E4890E;
  --marigold-light:#FFE3B3;
  --parrot:#33B27C;
  --parrot-dark:#278F62;
  --parrot-light:#CDF2E1;
  --plum:#8A4FC4;
  --plum-dark:#6B379D;
  --plum-light:#EBDBFA;
  --coral:#FF6B5B;
  --coral-dark:#E24C3C;
  --ink:#22283B;
  --ink-soft:#5B6178;
  --paper:#FFFDF9;
  --line:#E4E1F5;
  --coral-light:#FFD9D2;
  --indigo-dark:#1F5F94;
  --indigo-light:#D6ECFB;
  --sky-deep:#2F7FC1;
  --forest-deep:#0F3D2E;
  --forest-mid:#1E6B4C;
  --forest-light:#3F9E6E;
  --forest-canopy:#2A7F58;
  --trunk:#6B4226;
  --firefly:#FFE58A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Mukta',sans-serif;
  background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 38%, #EAF7EC 62%, #DCF0DE 100%);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
/* ---------- Forest background decoration ---------- */
.forest-bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.forest-bg .layer{position:absolute; left:0; right:0; width:100%;}
.forest-bg .hills-far{bottom:0; opacity:0.35;}
.forest-bg .hills-near{bottom:0; opacity:0.55;}
.forest-bg .vine-left, .forest-bg .vine-right{position:absolute; top:0; width:120px; height:340px; opacity:0.5;}
.forest-bg .vine-left{left:-24px;}
.forest-bg .vine-right{right:-24px; transform:scaleX(-1);}
.leaf-float{position:absolute; opacity:0.55; animation:leafDrift linear infinite;}
@keyframes leafDrift{
  0%{transform:translateY(-40px) rotate(0deg); opacity:0;}
  10%{opacity:0.55;}
  90%{opacity:0.5;}
  100%{transform:translateY(110vh) rotate(340deg); opacity:0;}
}
.firefly{position:absolute; width:6px; height:6px; border-radius:50%; background:var(--firefly);
  box-shadow:0 0 8px 3px var(--firefly); animation:fireflyPulse 3.2s ease-in-out infinite;}
@keyframes fireflyPulse{0%,100%{opacity:0.15; transform:scale(0.8);} 50%{opacity:0.9; transform:scale(1.15);}}
#app{position:relative; z-index:1;}
.hi{font-family:'Baloo Da 2',sans-serif;}
.en{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit; cursor:pointer;}
#app{max-width:720px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:30px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px 10px;
}
.brand{display:flex; align-items:center; gap:8px; cursor:pointer; border:none; background:none; padding:0;}
.brand-kite{width:34px; height:34px;}
.brand-name{font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:22px; color:var(--sky-deep); letter-spacing:0.2px;}
.star-wallet{
  display:flex; align-items:center; gap:6px;
  background:var(--paper); border:2px solid var(--marigold-light);
  padding:6px 14px; border-radius:999px; font-weight:700; color:var(--marigold-dark);
  box-shadow:0 2px 0 rgba(0,0,0,0.04);
}
.portal-back{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Mukta',sans-serif; font-size:12px; font-weight:700; color:var(--ink-soft);
  background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
  padding:5px 12px; margin:2px 18px 0;
}
.portal-back:active{opacity:0.7;}

/* ---------- Home ---------- */
.hero{
  text-align:center; padding:6px 24px 18px;
}
.hero h1{
  font-family:'Baloo Da 2',sans-serif; font-size:30px; margin:6px 0 4px; color:var(--ink);
}
.hero p{
  font-family:'Mukta',sans-serif; color:var(--ink-soft); font-size:15px; margin:0;
}
.subject-list{
  display:flex; flex-direction:column; gap:16px; padding:10px 18px 20px;
}
.subject-card{
  position:relative; overflow:hidden;
  border:none; text-align:left; border-radius:22px;
  padding:20px 20px 20px 96px; min-height:96px;
  display:flex; flex-direction:column; justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,0.08);
  transform:translateY(0); transition:transform .12s ease, box-shadow .12s ease;
}
.subject-card:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.08); }
.subject-card::after{
  content:"🌿"; position:absolute; right:10px; bottom:6px; font-size:26px; opacity:0.28;
  transform:rotate(-12deg);
}
.subject-card.marigold{ background:linear-gradient(135deg,#FFC46B,var(--marigold)); }
.subject-card.plum{ background:linear-gradient(135deg,#B888E8,var(--plum)); }
.subject-card.parrot{ background:linear-gradient(135deg,#63D19E,var(--parrot)); }
.subject-card.coral{ background:linear-gradient(135deg,#FF9B8F,var(--coral)); }
.subject-card.indigo{ background:linear-gradient(135deg,#7EC1F0,var(--sky-deep)); }
.subject-emoji{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:64px; height:64px; border-radius:18px; background:rgba(255,255,255,0.35);
  display:flex; align-items:center; justify-content:center; font-size:34px;
}
.subject-title{font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:21px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,0.08);}
.subject-sub{font-family:'Mukta',sans-serif; font-size:13.5px; color:rgba(255,255,255,0.92); margin-top:2px;}
.subject-progress{margin-top:8px; font-size:12.5px; color:rgba(255,255,255,0.95); font-weight:700;}

/* ---------- Level map ---------- */
.map-header{padding:14px 18px 4px; display:flex; align-items:center; gap:10px;}
.back-btn{
  border:none; background:var(--paper); width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,0.08);
  font-size:18px; color:var(--ink);
}
.map-title{font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:20px;}
.map-tagline{padding:0 18px 6px; color:var(--ink-soft); font-size:13.5px;}
.level-path{position:relative; padding:30px 20px 40px; display:flex; flex-direction:column; gap:34px; align-items:center;}
.level-path::before{
  content:""; position:absolute; top:10px; bottom:10px; left:50%; width:5px;
  transform:translateX(-50%);
  background-image:linear-gradient(var(--string-color,#C9C4E8) 60%, transparent 0%);
  background-size:5px 16px; background-repeat:repeat-y; border-radius:4px; opacity:0.7;
}
.level-node-wrap{position:relative; z-index:1; width:100%; display:flex;}
.level-node-wrap.left{justify-content:flex-start; padding-left:8%;}
.level-node-wrap.right{justify-content:flex-end; padding-right:8%;}
.level-node-wrap.mid{justify-content:center;}
.level-node{
  border:none; width:96px; height:96px; border-radius:26px; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transform:rotate(45deg); box-shadow:0 5px 0 rgba(0,0,0,0.12);
}
.level-node .inner{transform:rotate(-45deg); display:flex; flex-direction:column; align-items:center;}
.level-node .lvl-num{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; color:#fff;}
.level-node.locked{background:#D8DAE8 !important; box-shadow:0 5px 0 rgba(0,0,0,0.06);}
.level-node.locked .lvl-num{color:#9498B0;}
.level-tail{position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); width:2px; height:22px; background:#C9C4E8;}
.level-caption{margin-top:30px; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft); max-width:120px;}
.level-stars-mini{display:flex; gap:2px; margin-top:2px;}
.level-stars-mini span{font-size:12px;}

/* ---------- Play screen ---------- */
.play-wrap{padding:14px 18px 40px;}
.play-top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.progress-track{flex:1; height:12px; background:#EAE7F7; border-radius:8px; overflow:hidden;}
.progress-fill{height:100%; border-radius:8px; transition:width .3s ease;}
.play-score{font-weight:800; font-size:14px; color:var(--marigold-dark); white-space:nowrap;}
.mascot-row{display:flex; justify-content:center; align-items:flex-end; gap:10px; margin:6px 0 10px;}
.mascot-row svg{width:72px; height:72px;}
.mascot-row .buddy-svg{width:52px; height:52px;}
.question-card{
  background:var(--paper); border-radius:22px; padding:26px 20px; text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,0.06); border:2px solid var(--line);
}
.question-label{font-size:12.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;}
.question-text{font-family:'Baloo Da 2',sans-serif; font-size:26px; font-weight:700; line-height:1.5; color:var(--ink); word-break:break-word;}
.question-text .blank{
  display:inline-block; min-width:26px; border-bottom:4px solid var(--coral); margin:0 2px;
}
.question-text.en-q{font-family:'Baloo 2',sans-serif; font-size:19px; line-height:1.55;}
.question-text.math-q{font-family:'Baloo 2',sans-serif; font-size:34px; font-weight:800; letter-spacing:0.5px;}
.abacus-visual{max-width:260px; margin:14px auto 4px;}
.abacus-visual svg{width:100%; height:auto; display:block;}
.options-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px;}
.options-grid.matra{grid-template-columns:repeat(4,1fr);}
.opt-btn{
  border:2px solid var(--line); background:#fff; border-radius:16px; padding:16px 10px;
  font-size:17px; font-weight:700; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,0.05);
  transition:transform .08s ease;
}
.opt-btn.matra-opt{font-family:'Baloo Da 2',sans-serif; font-size:28px; padding:14px 6px;}
.opt-btn:active{transform:translateY(2px);}
.opt-btn.correct{background:var(--parrot-light); border-color:var(--parrot); color:var(--parrot-dark);}
.opt-btn.wrong{background:#FFE1DC; border-color:var(--coral); color:var(--coral-dark);}
.opt-btn.dim{opacity:0.45;}
.feedback-box{
  margin-top:16px; border-radius:16px; padding:12px 16px; font-size:14.5px; text-align:left;
  display:none; font-weight:500; line-height:1.5;
}
.feedback-box.show{display:block;}
.feedback-box.ok{background:var(--parrot-light); color:var(--parrot-dark);}
.feedback-box.no{background:#FFE1DC; color:var(--coral-dark);}
.feedback-word{
  font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:32px;
  text-align:center; margin-bottom:6px; letter-spacing:0.5px;
}
.feedback-word.en{font-family:'Baloo 2',sans-serif; font-size:24px;}
.feedback-note{font-size:14.5px; text-align:center;}
.next-btn{
  margin-top:16px; width:100%; border:none; border-radius:16px; padding:15px;
  background:var(--sky-deep); color:#fff; font-weight:800; font-size:16px;
  box-shadow:0 4px 0 rgba(0,0,0,0.12); display:none;
}
.next-btn.show{display:block;}
.dropdown-badge{
  display:inline-block; margin-bottom:8px; padding:4px 12px; border-radius:999px;
  background:var(--plum-light); color:var(--plum-dark); font-size:12px; font-weight:800;
}
.dropdown-wrap{margin-top:24px; display:flex; flex-direction:column; align-items:center; gap:14px;}
.dropdown-select{
  width:100%; max-width:260px; padding:14px 16px; font-size:17px; font-weight:700;
  border:2px solid var(--line); border-radius:14px; background:#fff; color:var(--ink);
  font-family:'Baloo Da 2','Baloo 2',sans-serif;
}
.dropdown-select.correct{border-color:var(--parrot); background:var(--parrot-light); color:var(--parrot-dark);}
.dropdown-select.wrong{border-color:var(--coral); background:#FFE1DC; color:var(--coral-dark);}
.check-btn{
  border:none; border-radius:14px; padding:13px 34px; font-weight:800; font-size:15px;
  background:var(--sky-deep); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.12);
}
.check-btn:disabled{opacity:0.6;}
.check-btn.shake{animation:shakeX .35s ease;}
@keyframes shakeX{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

/* ---------- Result screen ---------- */
.result-wrap{padding:40px 24px; text-align:center;}
.result-mascot{display:flex; justify-content:center; align-items:flex-end; gap:10px;}
.result-mascot svg{width:120px; height:120px;}
.result-mascot .buddy-svg{width:76px; height:76px;}
.result-title{font-family:'Baloo Da 2',sans-serif; font-size:26px; font-weight:800; margin:10px 0 2px;}
.result-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:18px;}
.stars-big{display:flex; justify-content:center; gap:10px; margin:18px 0;}
.stars-big span{font-size:52px; opacity:0.25; transform:scale(0.6); display:inline-block;}
.stars-big span.won{opacity:1; animation:pop .45s ease forwards;}
@keyframes pop{ 0%{transform:scale(0.4) rotate(-20deg);} 60%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(1) rotate(0);} }
.result-score{font-weight:800; color:var(--marigold-dark); font-size:16px; margin-bottom:22px;}
.result-actions{display:flex; flex-direction:column; gap:12px; max-width:320px; margin:0 auto;}
.btn-primary{border:none; border-radius:16px; padding:15px; font-weight:800; font-size:15.5px; color:#fff; background:var(--parrot); box-shadow:0 4px 0 rgba(0,0,0,0.1);}
.btn-secondary{border:2px solid var(--line); border-radius:16px; padding:14px; font-weight:700; font-size:15px; color:var(--ink); background:#fff;}

@media (min-width:480px){
  .question-text{font-size:30px;}
}

/* ---------- Abacus Learn screen ---------- */
.learn-wrap{padding:14px 18px 40px;}
.learn-header{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.learn-title{font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:20px;}
.learn-tagline{padding:0 0 12px; color:var(--ink-soft); font-size:13.5px;}
.mode-tabs{display:flex; gap:8px; margin-bottom:14px;}
.mode-tab{
  flex:1; border:2px solid var(--line); background:#fff; border-radius:14px;
  padding:10px 6px; font-weight:800; font-size:13.5px; color:var(--ink-soft);
  text-align:center;
}
.mode-tab.active{background:var(--indigo-dark); border-color:var(--indigo-dark); color:#fff;}
.digit-select{display:flex; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;}
.digit-btn{
  border:2px solid var(--line); background:#fff; border-radius:12px; padding:8px 14px;
  font-weight:800; font-size:13.5px; color:var(--ink-soft);
}
.digit-btn.active{background:var(--sky-deep); border-color:var(--sky-deep); color:#fff;}
.learn-card{
  background:var(--paper); border-radius:22px; padding:18px 14px 20px; text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,0.06); border:2px solid var(--line);
}
.learn-abacus-visual{max-width:100%; width:340px; margin:6px auto 10px;}
.learn-abacus-visual svg{width:100%; height:auto; display:block; touch-action:manipulation;}
.bead-hit{cursor:pointer;}
.number-display{
  font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:clamp(28px,8vw,44px); color:var(--indigo-dark);
  margin:6px 0 2px; letter-spacing:1px; word-break:break-all;
}
.expanded-form{font-size:13.5px; color:var(--ink-soft); margin-bottom:12px; word-break:break-word;}
.place-chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;}
.place-chip{
  border-radius:12px; padding:6px 12px; font-size:12px; font-weight:800; color:#fff; white-space:nowrap;
}
.challenge-box{
  background:var(--indigo-light); border-radius:16px; padding:12px 14px; margin-bottom:14px; text-align:center;
}
.challenge-target{font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:clamp(20px,6vw,26px); color:var(--indigo-dark);}
.challenge-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}
.challenge-feedback{margin-top:8px; font-weight:700; font-size:13.5px; min-height:20px;}
.challenge-feedback.ok{color:var(--parrot-dark);}
.challenge-feedback.no{color:var(--coral-dark);}
.learn-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
.learn-btn{
  border:none; border-radius:14px; padding:12px 18px; font-weight:800; font-size:14px;
  color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.1);
}
.learn-btn.primary{background:var(--sky-deep);}
.learn-btn.secondary{background:var(--parrot);}
.learn-btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line); box-shadow:none;}
.learn-cta{
  display:flex; align-items:center; justify-content:center; gap:8px; margin:4px 18px 16px;
  border:none; border-radius:16px; padding:14px; font-weight:800; font-size:14.5px; color:#fff;
  background:linear-gradient(135deg,#7EC1F0,var(--sky-deep)); box-shadow:0 4px 0 rgba(0,0,0,0.12);
  width:calc(100% - 36px);
}

/* ---------- Mobile responsive fixes ---------- */
@media (max-width:400px){
  #app{padding-bottom:20px;}
  .topbar{padding:12px 14px 8px;}
  .brand-name{font-size:18px;}
  .brand-kite{width:28px; height:28px;}
  .star-wallet{padding:5px 11px; font-size:13px;}
  .hero{padding:4px 16px 12px;}
  .hero h1{font-size:22px;}
  .hero p{font-size:13px;}
  .subject-list{padding:8px 12px 16px; gap:12px;}
  .subject-card{padding:15px 12px 15px 74px; min-height:78px; border-radius:18px;}
  .subject-card::after{font-size:20px; right:8px; bottom:4px;}
  .subject-emoji{width:50px; height:50px; font-size:26px; left:12px; border-radius:14px;}
  .subject-title{font-size:16.5px;}
  .subject-sub{font-size:11.5px;}
  .subject-progress{font-size:11.5px;}
  .map-header{padding:12px 14px 4px;}
  .map-title{font-size:18px;}
  .map-tagline{padding:0 14px 4px; font-size:12.5px;}
  .level-path{padding:22px 4px 30px; gap:24px;}
  .level-node-wrap.left{padding-left:0;}
  .level-node-wrap.right{padding-right:0;}
  .level-node{width:74px; height:74px; border-radius:18px;}
  .level-node .lvl-num{font-size:20px;}
  .level-caption{font-size:10.5px; max-width:96px; margin-top:26px;}
  .play-wrap{padding:12px 12px 30px;}
  .question-card{padding:18px 12px; border-radius:18px;}
  .question-text{font-size:20px;}
  .question-text.en-q{font-size:16px;}
  .question-text.math-q{font-size:25px;}
  .abacus-visual{max-width:100%;}
  .options-grid{gap:8px; margin-top:18px;}
  .options-grid.matra{grid-template-columns:repeat(2,1fr);}
  .opt-btn{font-size:14.5px; padding:13px 6px; border-radius:13px;}
  .opt-btn.matra-opt{font-size:23px;}
  .feedback-word{font-size:26px;}
  .result-wrap{padding:28px 18px;}
  .result-title{font-size:22px;}
  .learn-wrap{padding:12px 12px 30px;}
  .learn-card{padding:14px 8px 16px; border-radius:18px;}
  .mode-tab{font-size:12px; padding:9px 4px;}
  .digit-btn{font-size:12.5px; padding:7px 11px;}
  .place-chip{font-size:10.5px; padding:5px 9px;}
  .learn-btn{font-size:13px; padding:11px 14px;}
}
</style>
</head>
<body>
<div class="forest-bg" aria-hidden="true">
  <svg class="layer hills-far" viewBox="0 0 400 140" preserveAspectRatio="none" style="height:160px;">
    <path d="M0,140 L0,70 Q40,30 80,60 T160,55 T240,65 T320,45 T400,60 L400,140 Z" fill="#2A7F58"/>
  </svg>
  <svg class="layer hills-near" viewBox="0 0 400 120" preserveAspectRatio="none" style="height:120px;">
    <path d="M0,120 L0,85 Q50,45 100,80 T200,70 T300,85 T400,65 L400,120 Z" fill="#1E6B4C"/>
  </svg>

  learnDigits:2, learnValues:[0,0,0,0], learnMode:"free", challengeTarget:null, challengeFb:"", challengeMsg:"" };
let progress = {}; // { subjectKey: [stars0, stars1, ...] }
Object.keys(SUBJECTS).forEach(k=>{ progress[k] = SUBJECTS[k].levels.map(()=>0); });

function totalStars(){
  let t=0;
  Object.values(progress).forEach(arr=>arr.forEach(s=>t+=s));
  return t;
}
function unlockedCount(subjKey){
  const arr = progress[subjKey];
  let n = 1;
  for(let i=0;i<arr.length;i++){ if(arr[i]>0) n = Math.max(n, i+2); }
  return Math.min(n, arr.length);
}

/* ================= ABACUS SVG ================= */
function abacusSVG(number, places){
  const digits = String(number).padStart(places,'0').split('').map(Number);
  const rodGap = 74;
  const width = digits.length*rodGap + 30;
  const colors = ['#FF6B5B','#33B27C','#8A4FC4']; // place 0=ones(coral),1=tens(parrot),2=hundreds(plum)
  let svg = `<svg viewBox="0 0 ${width} 226" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="4" y="8" width="${width-8}" height="14" rx="7" fill="#22283B"/>`;
  svg += `<rect x="4" y="196" width="${width-8}" height="14" rx="7" fill="#22283B"/>`;
  digits.forEach((d,idx)=>{
    const cx = 34 + idx*rodGap;
    const place = digits.length - 1 - idx;
    const color = colors[place] || '#FFA630';
    svg += `<line x1="${cx}" y1="22" x2="${cx}" y2="196" stroke="#C7C3E8" stroke-width="4"/>`;
    for(let b=0;b<9;b++){
      const y = 187 - b*18;
      const filled = b < d;
      svg += `<circle cx="${cx}" cy="${y}" r="9" fill="${filled?color:'#EFEDFB'}" stroke="${filled?'#22283B':'#CFCBE8'}" stroke-width="1.5"/>`;
    }
    const label = place===0 ? 'इकाई' : place===1 ? 'दहाई' : place===2 ? 'सैकड़ा' : 'हज़ार';
    svg += `<text x="${cx}" y="216" font-size="13" font-weight="700" fill="#5B6178" text-anchor="middle" font-family="Mukta, sans-serif">${label}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ================= INTERACTIVE ABACUS (Learn screen) ================= */
const PLACE_COLORS = ['#FF6B5B','#33B27C','#8A4FC4','#FFA630']; // इकाई, दहाई, सैकड़ा, हज़ार
function placeNameHi(p){ return p===0 ? 'इकाई' : p===1 ? 'दहाई' : p===2 ? 'सैकड़ा' : 'हज़ार'; }

/* Builds a clickable abacus: each bead has data-place / data-bead so a click
   listener (attached after render) can set that rod's value directly —
   tapping a bead fills/empties the rod up to that bead, just like a real toy abacus. */
function interactiveAbacusSVG(values, digits){
  const rodGap = 92;
  const width = digits*rodGap + 44;
  let svg = `<svg viewBox="0 0 ${width} 244" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="4" y="10" width="${width-8}" height="14" rx="7" fill="#22283B"/>`;
  svg += `<rect x="4" y="206" width="${width-8}" height="14" rx="7" fill="#22283B"/>`;
  for(let idx=0; idx<digits; idx++){
    const place = digits - 1 - idx;
    const cx = 44 + idx*rodGap;
    const color = PLACE_COLORS[place] || '#FFA630';
    const val = values[place] || 0;
    svg += `<line x1="${cx}" y1="24" x2="${cx}" y2="206" stroke="#C7C3E8" stroke-width="4"/>`;
    for(let b=0;b<9;b++){
      const y = 197 - b*19;
      const filled = b < val;
      svg += `<circle class="bead-hit" data-place="${place}" data-bead="${b}" cx="${cx}" cy="${y}" r="12" fill="${filled?color:'#EFEDFB'}" stroke="${filled?'#22283B':'#CFCBE8'}" stroke-width="1.5"/>`;
    }
    svg += `<text x="${cx}" y="226" font-size="14" font-weight="700" fill="#5B6178" text-anchor="middle" font-family="Mukta, sans-serif">${placeNameHi(place)}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

/* ================= ABACUS LEARN SCREEN ================= */
function learnNumber(){
  let n = 0;
  for(let p=0;p<state.learnDigits;p++){ n += (state.learnValues[p]||0) * Math.pow(10,p); }
  return n;
}
function resetLearnValues(){ state.learnValues = [0,0,0,0]; }
function generateChallenge(){
  const digits = state.learnDigits;
  const min = digits===1 ? 0 : Math.pow(10, digits-1);
  const max = Math.pow(10, digits) - 1;
  state.challengeTarget = Math.floor(Math.random()*(max-min+1)) + min;
  state.challengeFb = ""; state.challengeMsg = "";
}
function checkChallenge(){
  const val = learnNumber();
  const correct = val === state.challengeTarget;
  const fb = document.getElementById('challengeFeedback');
  if(correct){
    state.challengeFb = "ok";
    state.challengeMsg = "✅ बहुत बढ़िया! बिल्कुल सही बनाया।";
    if(fb){ fb.className = "challenge-feedback ok"; fb.textContent = state.challengeMsg; }
    setTimeout(()=>{ generateChallenge(); resetLearnValues(); render(); }, 1300);
  } else {
    state.challengeFb = "no";
    state.challengeMsg = `❌ अभी अबेकस पर ${val} बना है, ${state.challengeTarget} नहीं — फिर कोशिश करो।`;
    if(fb){ fb.className = "challenge-feedback no"; fb.textContent = state.challengeMsg; }
  }
}

function renderLearn(){
  const digits = state.learnDigits;
  const val = learnNumber();

  if(state.learnMode==="challenge"){

    challengeHtml = `
      <div class="challenge-box">

      <div class="mode-tabs">
        <button class="mode-tab ${state.learnMode==='free'?'active':''}" data-mode="free">🖐️ स्वतंत्र अभ्यास</button>

      </div>
      <div class="digit-select">${digitBtns}</div>
      ${challengeHtml}
      <div class="learn-card">
        <div class="learn-abacus-visual">${svg}</div>
        <div class="number-display">${val}</div>
        <div class="expanded-form hi">${expanded}</div>
        <div class="place-chips">${chips}</div>
        <div class="learn-actions">
          ${state.learnMode==='challenge' ? '<button class="learn-btn primary" id="checkChallenge">जांचो ✓</button><button class="learn-btn secondary" id="newChallenge">नई चुनौती 🔄</button>' : ''}
          <button class="learn-btn ghost" id="resetLearn">रीसेट ↺</button>
        </div>
      </div>

  document.getElementById('backFromLearn').addEventListener('click', ()=>{ state.screen="map"; render(); });

      render();

    });

function shuffledOptions(q){
  const idxs = q.opts.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]] = [idxs[j],idxs[i]];
  }
  const opts = idxs.map(i=>q.opts[i]);
  const ans = idxs.indexOf(q.ans);
  return {opts, ans};
}

function onAnswer(i){
  if(state.answered) return;
  state.answered = true;
  const subj = SUBJECTS[state.subject];
  const level = subj.levels[state.levelIdx];
  const q = level.questions[state.qIdx];
  const correct = i === state.currentAns;
  if(correct) state.correctCount++;

  document.querySelectorAll('#optsWrap .opt-btn').forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx===state.currentAns) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if(q.type === "dropdown"){
    const sel = document.getElementById('dropdownSelect');
    const btn = document.getElementById('checkDropdown');
    if(sel){ sel.disabled = true; sel.classList.add(correct ? 'correct' : 'wrong'); }
    if(btn){ btn.disabled = true; }
  }

  const fb = document.getElementById('feedback');
  fb.className = "feedback-box show " + (correct?"ok":"no");
  const isMatra = state.subject === "matra";
  const bigWord = isMatra ? q.full : q.opts[q.ans];
  const wordClass = (q.math || q.abacus) ? "feedback-word en" : (isMatra || !q.en) ? "feedback-word hi" : "feedback-word en";
  fb.innerHTML = `
    <div class="${wordClass}">${bigWord}</div>
    <div class="feedback-note">${correct ? "✅ सही जवाब! " : "❌ थोड़ा और सोचो। "}${q.note||""}</div>
  `;

  const newMood = correct?"excited":"sad";
  document.getElementById('mascotHolder').innerHTML = mascot(newMood)+`<span class="buddy-svg">${jungleBuddy(newMood)}</span>`;
  document.getElementById('nextBtn').classList.add('show');
}

function onNext(){
  const subj = SUBJECTS[state.subject];
  const level = subj.levels[state.levelIdx];
  if(state.qIdx < level.questions.length-1){
    state.qIdx++;
    state.answered = false;
    render();
  } else {
    const pct = state.correctCount / level.questions.length;
    let stars = pct===1 ? 3 : pct>=0.6 ? 2 : 1;
    if(stars > progress[state.subject][state.levelIdx]) progress[state.subject][state.levelIdx] = stars;
    state.screen = "result";
    render();
  }
}

function renderResult(){
  const subj = SUBJECTS[state.subject];
  const level = subj.levels[state.levelIdx];
  const total = level.questions.length;
  const pct = state.correctCount/total;
  const stars = pct===1 ? 3 : pct>=0.6 ? 2 : 1;
  const mood = stars===3 ? "excited" : stars===2 ? "happy" : "sad";
  const hasNext = state.levelIdx < subj.levels.length-1;

  app.innerHTML = `
    <div class="result-wrap">
      <div class="result-mascot">${mascot(mood)}<span class="buddy-svg">${jungleBuddy(mood)}</span></div>
      <div class="result-title hi">${stars===3?"शानदार!":stars===2?"बहुत बढ़िया!":"अच्छी कोशिश!"}</div>
      <div class="result-sub hi">${level.title} पूरा हुआ</div>
      <div class="stars-big" id="starsBig">
        <span data-s="1">⭐</span><span data-s="2">⭐</span><span data-s="3">⭐</span>
      </div>
      <div class="result-score">${state.correctCount} / ${total} सही जवाब</div>
      <div class="result-actions">
        ${hasNext?'<button class="btn-primary" id="nextLevelBtn">अगला स्तर →</button>':''}
        <button class="btn-secondary" id="retryBtn">फिर से खेलें</button>
        <button class="btn-secondary" id="mapBtn">स्तर मानचित्र</button>
      </div>
    </div>
  `;
  const starEls = document.querySelectorAll('#starsBig span');
  starEls.forEach((el,idx)=>{
    if(idx < stars){
      setTimeout(()=>{ el.classList.add('won'); }, idx*180);
    }
  });
  if(hasNext) document.getElementById('nextLevelBtn').addEventListener('click', ()=>{
    state.levelIdx++; state.qIdx=0; state.correctCount=0; state.answered=false; state.screen="play"; render();
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    state.qIdx=0; state.correctCount=0; state.answered=false; state.screen="play"; render();
  });
  document.getElementById('mapBtn').addEventListener('click', ()=>{ state.screen="map"; render(); });
}

render();
</script>
</body>
</html>
